<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — الصفحة غير موجودة</title>
<meta name="theme-color" content="#000000">
<style>
@import url('https://fonts.googleapis.com/css2?family=Mada:wght@400;700;900&display=swap');
@font-face { font-family:'AppTitle'; src:url('https://files.catbox.moe/t4hxiu.ttf') format('truetype'); }
@font-face { font-family:'AppBody'; src:url('https://files.catbox.moe/5nhg4t.ttf') format('truetype'); }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:#000;
  color:#fff;
  font-family:'AppBody','Mada',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  position:relative;
}

/* animated grid background */
.grid-bg{
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:40px 40px;
  animation:grid-drift 20s linear infinite;
  pointer-events:none;
}
@keyframes grid-drift{
  0%{transform:translate(0,0)}
  100%{transform:translate(40px,40px)}
}

/* glowing orbs */
.orb{
  position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;
  animation:orb-float 8s ease-in-out infinite;
}
.orb1{width:400px;height:400px;background:rgba(255,255,255,0.04);top:-100px;right:-100px;}
.orb2{width:300px;height:300px;background:rgba(255,255,255,0.03);bottom:-80px;left:-80px;animation-delay:-4s;}
@keyframes orb-float{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-30px) scale(1.05)}
}

/* scan line */
.scanline{
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.01) 2px,rgba(255,255,255,0.01) 4px);
  pointer-events:none;animation:scanline 8s linear infinite;
}
@keyframes scanline{
  0%{background-position:0 0}100%{background-position:0 100vh}
}

.container{
  position:relative;z-index:10;
  text-align:center;padding:32px 24px;
  max-width:480px;width:100%;
}

/* glitch 404 */
.error-code{
  font-family:'AppTitle',sans-serif;
  font-size:clamp(6rem,25vw,10rem);
  font-weight:900;
  line-height:1;
  color:#fff;
  position:relative;
  letter-spacing:-0.02em;
  margin-bottom:0;
  text-shadow:
    0 0 40px rgba(255,255,255,0.3),
    0 0 80px rgba(255,255,255,0.1);
  animation:glitch-main 3s infinite;
}
.error-code::before,.error-code::after{
  content:'404';
  position:absolute;inset:0;
  font-family:inherit;font-size:inherit;font-weight:inherit;
}
.error-code::before{
  color:rgba(255,100,100,0.7);
  clip-path:polygon(0 0,100% 0,100% 35%,0 35%);
  animation:glitch-top 2s infinite;
  left:2px;
}
.error-code::after{
  color:rgba(100,200,255,0.7);
  clip-path:polygon(0 65%,100% 65%,100% 100%,0 100%);
  animation:glitch-bottom 2.5s infinite;
  left:-2px;
}
@keyframes glitch-main{
  0%,90%,100%{transform:skew(0deg)}
  92%{transform:skew(-0.5deg)}
  95%{transform:skew(0.5deg)}
}
@keyframes glitch-top{
  0%,85%,100%{transform:translate(0,0)}
  87%{transform:translate(-3px,-2px)}
  90%{transform:translate(3px,1px)}
  93%{transform:translate(0,0)}
}
@keyframes glitch-bottom{
  0%,80%,100%{transform:translate(0,0)}
  83%{transform:translate(2px,2px)}
  87%{transform:translate(-2px,-1px)}
  90%{transform:translate(0,0)}
}

/* terminal blink cursor */
.cursor{
  display:inline-block;width:3px;height:1em;
  background:#fff;vertical-align:text-bottom;margin-right:2px;
  animation:blink 1s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.error-label{
  font-size:0.75rem;letter-spacing:0.3rem;
  color:rgba(255,255,255,0.3);
  text-transform:uppercase;
  margin-bottom:24px;
  font-family:'AppTitle',sans-serif;
}

.glass-card{
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  padding:28px 24px;
  margin-bottom:28px;
}

.error-title{
  font-family:'AppTitle',sans-serif;
  font-size:1.4rem;margin-bottom:10px;
}
.error-desc{
  font-size:0.9rem;color:rgba(255,255,255,0.5);
  line-height:1.7;margin-bottom:0;
}

/* terminal text */
.terminal{
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:14px 16px;
  text-align:right;margin-bottom:20px;
  font-family:'Courier New',monospace;font-size:0.8rem;
}
.terminal-line{color:rgba(255,255,255,0.3);margin-bottom:4px;}
.terminal-line:last-child{margin-bottom:0;}
.terminal-line .prompt{color:rgba(255,255,255,0.2);}
.terminal-line .cmd{color:rgba(255,255,255,0.6);}
.terminal-line .result{color:rgba(255,100,100,0.7);}
.terminal-line .ok{color:rgba(100,255,150,0.7);}

.btn-group{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:50px;font-size:0.9rem;
  font-family:'AppBody','Mada',sans-serif;font-weight:600;
  cursor:pointer;border:none;transition:all 0.3s ease;
  text-decoration:none;
}
.btn-primary{
  background:#fff;color:#000;
  box-shadow:0 0 20px rgba(255,255,255,0.2);
}
.btn-primary:hover{background:rgba(255,255,255,0.9);transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,255,255,0.25);}
.btn-ghost{
  background:rgba(255,255,255,0.06);color:#fff;
  border:1px solid rgba(255,255,255,0.1);
}
.btn-ghost:hover{background:rgba(255,255,255,0.1);transform:translateY(-2px);}
.btn svg{width:18px;height:18px;}

/* logo at bottom */
.brand{
  margin-top:28px;font-family:'AppTitle',sans-serif;
  font-size:1.2rem;letter-spacing:0.4rem;
  color:rgba(255,255,255,0.2);
}

/* floating particles */
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.particle{
  position:absolute;width:1px;height:1px;
  background:#fff;border-radius:50%;
  animation:particle-rise linear infinite;
  opacity:0;
}
@keyframes particle-rise{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:0.6}
  90%{opacity:0.2}
  100%{transform:translateY(-20px) scale(1);opacity:0}
}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="scanline"></div>
<div class="particles" id="particles"></div>

<div class="container">

  <div class="error-label">خطأ · Error</div>

  <div class="error-code">404</div>

  <div class="glass-card">
    <div class="error-title">الصفحة غير موجودة</div>
    <div class="error-desc">
      يبدو أن هذه الصفحة ضلّت طريقها في الفضاء الرقمي.<br>
      ربما تم حذفها أو تغيير رابطها أو أنها لم تكن موجودة أصلاً.
    </div>
  </div>

  <div class="terminal">
    <div class="terminal-line"><span class="prompt">$ </span><span class="cmd">GET <span id="path-display">/</span></span></div>
    <div class="terminal-line"><span class="result">✗ 404 Not Found — Resource does not exist</span></div>
    <div class="terminal-line"><span class="prompt">$ </span><span class="cmd">redirect → /home</span> <span class="ok">→ pending...</span><span class="cursor"></span></div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      رجوع
    </button>
    <a href="/" class="btn btn-ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      الرئيسية
    </a>
  </div>

  <div class="brand">404</div>

</div>

<script>
// Show current path
const pathEl = document.getElementById('path-display');
pathEl.textContent = window.location.pathname;

// Go back
function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = '/';
  }
}

// Generate particles
const container = document.getElementById('particles');
for (let i = 0; i < 40; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.width = p.style.height = (Math.random() * 2 + 1) + 'px';
  p.style.animationDuration = (Math.random() * 8 + 6) + 's';
  p.style.animationDelay = (Math.random() * 8) + 's';
  container.appendChild(p);
}
</script>
</body>
</html>
